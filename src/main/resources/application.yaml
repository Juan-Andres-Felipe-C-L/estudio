spring:
  application:
    name: Study

  datasource:
    url: jdbc:mysql://localhost:3306/BD_study
    username: root
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties: # Configuracion adicional
      hibernate:
        "[format_sql]": true # Formatea el lenguaje SQL

server:
  port: 8080
  servlet:
    context-path: /api/v1/users

security:
  jwt:
    secret-key: ${env.jwt.secret-key}
    token-expiration: ${env.jwt.token-expiration}
